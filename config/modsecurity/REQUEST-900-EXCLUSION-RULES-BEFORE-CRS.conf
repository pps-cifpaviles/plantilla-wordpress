# Exclusiones que se cargan ANTES de las reglas del OWASP CRS.
#
# Úsalas para quitar falsos positivos de forma acotada, nunca para desactivar
# el WAF entero. Ejemplo: no inspeccionar el contenido de las entradas que se
# guardan desde el editor de WordPress (solo para usuarios autenticados).
#
# SecRule REQUEST_FILENAME "@endsWith /wp-admin/post.php" \
#     "id:1000,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:content"
#
# El CRS trae un plugin específico para WordPress (wordpress-rule-exclusions);
# en el Lab 6 compararás ambos enfoques.
